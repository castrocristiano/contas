[project]
name = "contas"
version = "0.1.0"
description = "Sistema de gestão financeira doméstica com suporte a MCP e OpenAI"
readme = "README.md"
authors = [
    { name = "Cristiano Castro", email = "cscastro87@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "mcp[cli]>=2.2.0",
    "openai>=1.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.21",
    "streamlit>=1.35.0",
    "pypdf>=4.0.0",
    "fonttools>=4.50.0",
]

[project.scripts]
contas = "contas:main"
contas-ui = "contas.ui.app:run_app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
