version: "3.8"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: contas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contas}
      POSTGRES_USER: ${POSTGRES_USER:-contas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contas}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-contas} -d ${POSTGRES_DB:-contas} -h localhost"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - contas_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contas}:${POSTGRES_PASSWORD:-contas}@db:5432/${POSTGRES_DB:-contas}
      OPENAPI_KEY: ${OPENAPI_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAIAPI_KEY: ${OPENAIAPI_KEY:-}
    ports:
      - "8501:8501"
    networks:
      - contas_network

volumes:
  postgres_data:
    driver: local

networks:
  contas_network:
    driver: bridge
