# ==============================================================================
# SonarQube Community Server Configuration
# ==============================================================================

sonar.projectKey=contas
sonar.projectName=contas
sonar.projectVersion=0.1.0

# Paths
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/__pycache__/**, **/*.pyc, **/.venv/**, **/alembic/versions/**
sonar.coverage.exclusions=tests/**, **/alembic/**, **/__init__.py

# Language & Reports
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
