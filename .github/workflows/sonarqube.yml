name: SonarQube Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarqube:
    name: SonarQube Scan & Quality Gate
    runs-on: ubuntu-latest

    # Sobe o SonarQube Community Edition (gratuito) e Postgres para os testes
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contas
          POSTGRES_USER: contas
          POSTGRES_PASSWORD: contas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      sonarqube:
        image: sonarqube:10.5-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        options: >-
          --health-cmd "curl -s -f http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://contas:contas@localhost:5432/contas
        run: uv run alembic upgrade head

      - name: Run Tests with XML Coverage
        env:
          DATABASE_URL: postgresql+psycopg://contas:contas@localhost:5432/contas
        run: uv run pytest -v --cov=src/contas --cov-report=xml:coverage.xml

      - name: Wait for SonarQube Server to be fully ready
        run: |
          echo "Aguardando inicialização completa do SonarQube..."
          for i in {1..60}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status | grep -Po '"status":"\K[^"]*' || echo "DOWN")
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube está pronto!"
              break
            fi
            echo "Aguardando SonarQube status UP (status atual: $STATUS)... ($i/60)"
            sleep 5
          done

      - name: Authenticate and Generate SonarQube Project & Token
        id: sonar-setup
        run: |
          # Altera a senha inicial padrão do admin (admin -> admin1234)
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=admin1234" || true
          
          # Cria o projeto se ainda não existir
          curl -s -u admin:admin1234 -X POST "http://localhost:9000/api/projects/create?name=contas&project=contas" || true
          
          # Gera um token de análise
          TOKEN_JSON=$(curl -s -u admin:admin1234 -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-token-$(date +%s)")
          ANALYSIS_TOKEN=$(echo "$TOKEN_JSON" | grep -Po '"token":"\K[^"]*' || echo "")
          
          if [ -z "$ANALYSIS_TOKEN" ]; then
            # Se já existir token com esse nome, usa autenticação básica alternativa
            ANALYSIS_TOKEN="admin1234"
          fi
          
          echo "token=$ANALYSIS_TOKEN" >> $GITHUB_OUTPUT

      - name: SonarQube Community Container Scanner
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ steps.sonar-setup.outputs.token }}
          SONAR_HOST_URL: "http://localhost:9000"
        with:
          args: >
            -Dsonar.projectKey=contas
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Validate SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ steps.sonar-setup.outputs.token }}
          SONAR_HOST_URL: "http://localhost:9000"
